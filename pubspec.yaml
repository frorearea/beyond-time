name: beyond_time
description: "A quiet witch-library character agent sanctuary."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies: {}

flutter:
  uses-material-design: true

  assets:
    - assets/images/ereta-cropped-display.webp
    - assets/prompts/ereta_persona.txt
    - assets/sounds/

  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-subset.ttf
    - family: SimHei
      fonts:
        - asset: assets/fonts/SimHei.ttf
