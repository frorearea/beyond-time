  <meta property="og:image" content="/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="时间之外">
  <meta name="twitter:description" content="在魔女的图书馆，重新听见自己。">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>时间之外</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    版本更新提示。

    为什么不靠 service worker：Flutter 生成的 flutter_service_worker.js 每次构建
    **内容完全相同**（一个固定的 784 字节桩：install 时 skipWaiting，activate 时
    注销自己并 navigate 所有 client）。浏览器按脚本字节比对判断"有没有新版本"，
    字节一样就永远不触发 install/activate——所以它自带的那次自动 reload 从来不会发生。

    所以这里自己比对构建号，取的是 flutter_bootstrap.js 里的 serviceWorkerVersion
    （Flutter 每次构建重算、随内容变化）。检测到服务器上是新构建时：显示一句提示 →
    把关键文件用 cache:'reload' 重新拉一遍（GitHub Pages 给静态资源
    cache-control: max-age=600，光 reload 还会命中旧缓存，那会变成"reload → 仍是旧版 →
    又检测到新版 → 再 reload"的死循环）→ reload 一次。

    ⚠️ 两条血泪约束（v1 因为违反第一条，把页面永久卡在了这句提示上）：
      1. **reload 绝不能挂在没有上限的网络操作上。** 国内直连 GitHub Pages 很慢，
         main.dart.js 有 2.7MB；fetch 本身没有超时，一个挂住的请求会让 Promise.all
         永不 settle，reload 就永远不来。所以：每个请求各自带 AbortController 超时，
         整体再有预算，最后还有一个"无论如何都 reload"的绝对期限。
      2. **全屏遮罩必须有兜底消失时间。** 任何情况下都不能让人被关在一片黑里。
  -->
  <style>
    /* ⚠️ 默认必须是 display:none，靠 .is-on 才显示。
       曾经写成 `#shelf-notice { display: flex }` + `<div hidden>`——
       **作者样式永远优先于浏览器默认样式表**，所以 `[hidden]{display:none}` 被压掉，
       遮罩从第一帧就盖在页面上，`el.hidden = true` 也永远不起作用，
       整页被永久锁死。默认不可见才是安全的状态：即使脚本完全没跑，页面也能用。 */
    #shelf-notice {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: LXGWWenKai, STSong, "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      font-size: 20px;
      letter-spacing: 0.12em;
      z-index: 9999;
      opacity: 1;
    }
    #shelf-notice.is-on {
      display: flex;
      animation: shelf-notice-in 300ms ease-out;
    }
    /* 不加 forwards：动画结束后回到基础规则的 opacity:1，不靠动画锁状态 */
    @keyframes shelf-notice-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <div id="shelf-notice">图书馆刚整理过书架</div>

  <script>
    (function () {
      // 与 lib/config.dart 的 kJustTidiedKey 必须一致（Dart 侧读它来显示回执）。
      var NOTICE_KEY = 'beyondTimeJustTidied';
      var BUILD_KEY = 'beyondTimeRunningBuild';
      var ATTEMPT_KEY = 'beyondTimeUpdateReloadAt';
      var BOOTSTRAP = 'flutter_bootstrap.js';

      // 时间预算：没有一个"等网络"的动作可以无限期挂着。
      var REQUEST_TIMEOUT_MS = 1200; // 单个预热请求的上限（含 2.7MB 的 main.dart.js）
      var PREWARM_BUDGET_MS = 1300;  // 预热整体最多等这么久，到点就走
      var NOTICE_MIN_MS = 600;       // 提示至少让人看清
      var RELOAD_DEADLINE_MS = 1500; // 绝对期限：无论预热走到哪一步都 reload
      var NOTICE_VISIBLE_MS = 1000;  // 遮罩最多亮这么久，然后从 DOM 里删掉

      var reloaded = false;

      function noticeEl() { return document.getElementById('shelf-notice'); }
      function showNotice() {
        var el = noticeEl();
        if (el) el.classList.add('is-on');
      }
      /// **直接从 DOM 删除**，而不是设 hidden。
      ///
      /// 设 `hidden` 曾经完全失效（作者 CSS 的 display 压过了 `[hidden]`），
      /// 删除节点则是任何样式都无法撤销的。
      function removeNotice() {
        var el = noticeEl();
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }

      /// 带超时的 fetch。
      ///
      /// fetch 自身没有超时：一个挂住的请求会让 Promise.all 永不 settle，
      /// 预热完不成就不 reload。所以每个请求都要能自己放弃。
      /// （预热只是锦上添花，relaod 另有绝对期限兜底，见 [scheduleReload]。）
      function fetchWithTimeout(url, ms) {
        if (typeof AbortController !== 'function') {
          return Promise.resolve(); // 老浏览器：不预热，交给期限保证 reload
        }
        var ctl = new AbortController();
        var timer = setTimeout(function () { ctl.abort(); }, ms);
        return fetch(url, { cache: 'reload', signal: ctl.signal })
          .catch(function () {})
          .then(function (r) { clearTimeout(timer); return r; });
      }

      // 用 cache:'reload' 强制回源，把 HTTP 缓存里的旧副本换掉。
      // 拉不完也没关系——下面的期限会照常 reload，只是可能还拿到旧副本。
      function prewarm() {
        var files = ['index.html', BOOTSTRAP, 'main.dart.js', 'version.json'];
        return Promise.all(files.map(function (f) {
          return fetchWithTimeout(f, REQUEST_TIMEOUT_MS);
        }));
      }

      // 老版本 Flutter 的 service worker 会缓存资源；顺手清掉，别让旧副本留下。
      function clearCaches() {
        if (!('caches' in window)) return Promise.resolve();
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).catch(function () {});
      }

      function reloadOnce() {
        if (reloaded) return;
        reloaded = true;
        removeNotice();          // 先收遮罩，再 reload
        try { location.reload(); } catch (e) {}
      }

      function scheduleReload() {
        var startedAt = Date.now();
        // 兜底一：绝对期限（无论预热走到哪一步）
        setTimeout(reloadOnce, RELOAD_DEADLINE_MS);
        // 兜底二：遮罩最多亮 1 秒——**从 DOM 删掉**，任何样式都撤不回来
        setTimeout(removeNotice, NOTICE_VISIBLE_MS);

        var budget = Promise.race([
          Promise.all([clearCaches(), prewarm()]).catch(function () {}),
          new Promise(function (res) { setTimeout(res, PREWARM_BUDGET_MS); }),
        ]);
        budget.then(function () {
          var wait = Math.max(0, NOTICE_MIN_MS - (Date.now() - startedAt));
          setTimeout(reloadOnce, wait);
        }).catch(function () { reloadOnce(); });
      }

      // 构建号取自 flutter_bootstrap.js 里的 serviceWorkerVersion——它是 Flutter 每次
      // 构建重算的、**随内容变化**的值（本地 1744333830 vs 线上 16290139 实测不同）。
      //
      // 注意 **不要**改用 build/web/.last_build_id：我实测过，改了源码重新构建之后
      // 它一个字节都不变（它只反映构建配置），拿它当标记会永远认为"没有新版本"。
      // 用 cache:'no-cache' 而不是 'no-store'：让浏览器带 ETag 去校验，
      // 没更新时是一个 304，省流量。
      fetch(BOOTSTRAP, { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.text() : null; })
        .then(function (text) {
          if (!text) return;
          var m = /serviceWorkerVersion:\s*"([^"]+)"/.exec(text);
          var id = m ? m[1].trim() : '';
          if (!id) return;                       // 开发服务器等情况下没有这个字面量
          var running = null;
          try { running = localStorage.getItem(BUILD_KEY); } catch (e) { return; }
          if (running === null) {                // 第一次来：只记下，不打扰
            try { localStorage.setItem(BUILD_KEY, id); } catch (e) {}
            return;
          }
          if (running === id) return;            // 已经是最新

          // 服务器上是新构建，而当前这一页是旧的。
          var now = Date.now();
          var lastAttempt = 0;
          try { lastAttempt = Number(localStorage.getItem(ATTEMPT_KEY)) || 0; } catch (e) {}
          try {
            localStorage.setItem(BUILD_KEY, id);
            localStorage.setItem(NOTICE_KEY, '1');
            localStorage.setItem(ATTEMPT_KEY, String(now));
          } catch (e) {}

          showNotice();
          // 无论走哪条路，遮罩都在 1 秒内从 DOM 里删掉
          setTimeout(removeNotice, NOTICE_VISIBLE_MS);

          // 一分钟内刚自动 reload 过，说明缓存还没换掉：这次只提示，不再刷页面。
          if (now - lastAttempt < 60 * 1000) return;

          scheduleReload();
        })
        .catch(function () {});
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
